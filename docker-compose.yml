services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Monte uniquement les données, pas tout le code source.
      # Monter "." entier en production écrase l'image buildée, ce qui
      # annule le bénéfice de Docker et peut causer des bugs subtils.
      - ./data:/app/data
      - ./model:/app/model
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3